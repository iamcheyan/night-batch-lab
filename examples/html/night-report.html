<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Night Batch Report</title>
  </head>
  <body>
    <main id="night-report">
      <h1>Night Batch Report</h1>
      <section class="summary">
        <h2>Settlement Summary</h2>

      <section class="operations">
        <h2>Operations</h2>
        <button id="refresh-report" type="button">Refresh</button>
      </section>
    </main>
  </body>
</html>
