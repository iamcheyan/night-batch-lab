# Shared training configuration for the Windows Batch examples.
# Format: KEY=VALUE. Keep values unquoted.
# Tokens @ROOT@ and @DATE@ are expanded by the Batch entry point.

# nightly-main.bat paths and program contracts
NIGHT_ROOT=@ROOT@
NIGHT_INPUT_FILE=@ROOT@\data\input\transactions.csv
NIGHT_OUTPUT_FILE=@ROOT@\data\output\settlement-report.txt
NIGHT_ARCHIVE_DIR=@ROOT@\data\archive\@DATE@
NIGHT_REMOTE_DIR=@ROOT@\data\remote
NIGHT_LOG_DIR=@ROOT@\logs
NIGHT_COBOL_EXE=@ROOT@\bin\nightsettle.exe
NIGHT_VALIDATE_BAT=@ROOT@\windows-batch\validate-input.bat
NIGHT_UPLOAD_BAT=@ROOT@\windows-batch\upload-sim.bat

# csv2xls-upload.bat directories and external program contract
CSV2XLS_CSV_DIR=@ROOT@\data\input\csv-conf
CSV2XLS_XLS_DIR=@ROOT@\data\output\xls
CSV2XLS_REMOTE_DIR=@ROOT@\data\remote\linux
CSV2XLS_ARCHIVE_ROOT=@ROOT@\data\archive\csv2xls
CSV2XLS_LOG_DIR=@ROOT@\logs
CSV2XLS_STATUS_DIR=@ROOT@\data\status
CSV2XLS_CONVERTER=@ROOT@\windows-batch\CSV2XLS.js
CSV2XLS_UPLOAD_MODE=simulate
CSV2XLS_CONTINUE_ON_ERROR=N
CSV2XLS_OVERWRITE_OUTPUT=Y

# Keep FTP values blank in the repository. Inject approved values out-of-band.
CSV2XLS_FTP_HOST=
CSV2XLS_FTP_USER=
CSV2XLS_FTP_PASSWORD=
CSV2XLS_FTP_TARGET=
